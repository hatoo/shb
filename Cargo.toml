[package]
name = "shb"
version = "0.1.0"
authors = ["hatoo <hato2000@gmail.com>"]
edition = "2024"
rust-version = "1.91"
description = "Simple HTTP Benchmarker: an io_uring based HTTP/1.1, HTTP/2 and HTTP/3 load generator"
documentation = "https://github.com/hatoo/shb"
repository = "https://github.com/hatoo/shb"
readme = "README.md"
license = "MIT"
keywords = ["cli", "load-testing", "benchmark", "http", "io-uring"]
categories = [
    "command-line-utilities",
    "network-programming",
    "web-programming::http-client",
    "development-tools::profiling",
]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
humantime = "2.4.0"
io-uring = "0.7.14"
libc = "0.2"
memchr = "2.8.3"
num_cpus = "1.17.0"
quinn-proto = { version = "0.11.17", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
socket2 = "0.6.5"

[dev-dependencies]
axum = { version = "0.8", features = ["http2"] }
bytes = "1.12.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.14.9"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

# Optimised build used for released binaries. Kept separate from `release`
# so local `cargo build --release` stays fast.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
