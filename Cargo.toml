[package]
name = "shb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
humantime = "2.4.0"
io-uring = "0.7.14"
libc = "0.2"
num_cpus = "1.17.0"
quinn-proto = { version = "0.11.17", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
shiguredo_http11 = "=2026.7.0-canary.2"
shiguredo_http2 = "2026.1.0-canary.13"
shiguredo_http3 = "=2026.1.0-canary.8"
socket2 = "0.6.5"

[dev-dependencies]
axum = { version = "0.8", features = ["http2"] }
bytes = "1.12.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.14.9"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
