name: Receive heap qualification

on:
  push:
    branches: [codex/validate-quic-receive-heap-c429-20261124]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          ref: b04b25c54cd62c91090a4222e1e760e87d897eab
          path: .baseline
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: hatoo/hfast
          ref: ea8501c534174f7c1b613e0c8b8de2cfefb49ee3
          path: .hfast
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Candidate correctness and frozen release
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/candidate-target
        run: |
          mkdir -p "$RUNNER_TEMP/qualification/inputs"
          cargo fmt --check
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/qualification/test-debug.log"
          cargo test --release --locked 2>&1 | tee "$RUNNER_TEMP/qualification/test-release.log"
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
          cp "$CARGO_TARGET_DIR/release/shb" "$RUNNER_TEMP/qualification/inputs/candidate"
          cargo build --release --locked --example quic-timer-peer --example h2-request-encoding
      - name: Baseline and fixed server with identical toolchain
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/baseline-target" cargo build --manifest-path .baseline/Cargo.toml --release --locked
          CARGO_TARGET_DIR="$RUNNER_TEMP/hfast-target" cargo build --manifest-path .hfast/Cargo.toml --release --locked
          cp "$RUNNER_TEMP/baseline-target/release/shb" "$RUNNER_TEMP/qualification/inputs/baseline"
          cp "$RUNNER_TEMP/hfast-target/release/hfast" "$RUNNER_TEMP/qualification/inputs/hfast"
      - name: Fixed native peer and actual candidate byte observer
        run: |
          python benchmarks/build-native-reordering.py "$RUNNER_TEMP/peer-build"
          python benchmarks/build-reordering-exposure.py "$GITHUB_SHA" "$RUNNER_TEMP/observer-build"
          cp "$RUNNER_TEMP/peer-build/native-reordering-peer" "$RUNNER_TEMP/qualification/inputs/peer"
          cp "$RUNNER_TEMP/peer-build/manifest.json" "$RUNNER_TEMP/qualification/peer-manifest.json"
          cp "$RUNNER_TEMP/observer-build/manifest.json" "$RUNNER_TEMP/qualification/observer-manifest.json"
          cp "$RUNNER_TEMP/observer-build/exposure.patch" "$RUNNER_TEMP/qualification/observer.patch"
          chmod 555 "$RUNNER_TEMP/qualification/inputs/"*
      - name: Bind runtime source and frozen inputs
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'qualification'
          def sources(root):
              paths = sorted((root / 'src').rglob('*.rs')) + [root / 'Cargo.toml', root / 'Cargo.lock']
              return {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          baseline, candidate = sources(Path('.baseline')), sources(Path('.'))
          changed = sorted(p for p in baseline.keys() | candidate.keys() if baseline.get(p) != candidate.get(p))
          assert changed == ['src/quic/receive_limit_tests.rs', 'src/quic/receive_queue_tests.rs', 'src/quic/stream.rs'], changed
          info = dict(baseline_revision=subprocess.check_output(['git', '-C', '.baseline', 'rev-parse', 'HEAD'], text=True).strip(),
                      candidate_revision=os.environ['GITHUB_SHA'], baseline_sources=baseline, candidate_sources=candidate,
                      hfast_revision=subprocess.check_output(['git', '-C', '.hfast', 'rev-parse', 'HEAD'], text=True).strip(),
                      hfast_sources=sources(Path('.hfast')), changed=changed,
                      rustc=subprocess.check_output(['rustc', '-Vv'], text=True),
                      binaries={p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in (out / 'inputs').iterdir()})
          (out / 'build-manifest.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
      - name: Runner faults and independent protocol/receive oracles
        run: |
          python -m pip install aioquic==1.3.0 pylsqpack==0.3.24 hpack==4.1.0 h2==4.3.0
          for suite in test_heap_guards test_measure_process test_native_measurements test_native_reordering test_report_accounting test_quic_receive_reassembly; do
            python -m unittest discover -s benchmarks -p "$suite.py" -v
          done
          python benchmarks/check-quic-receive-reassembly.py --adapter "$RUNNER_TEMP/candidate-target/release/examples/quic-timer-peer" --output "$RUNNER_TEMP/qualification/reassembly"
          python benchmarks/check-quic-receive-limits.py --shb "$RUNNER_TEMP/qualification/inputs/candidate"
          python benchmarks/check-quic-receive-history.py --shb "$RUNNER_TEMP/qualification/inputs/candidate" > "$RUNNER_TEMP/qualification/history.json"
          python benchmarks/check-quic-response-recovery.py --shb "$RUNNER_TEMP/qualification/inputs/candidate" > "$RUNNER_TEMP/qualification/recovery.json"
          python benchmarks/check-h2-request-encoding.py --probe "$RUNNER_TEMP/candidate-target/release/examples/h2-request-encoding" --shb "$RUNNER_TEMP/qualification/inputs/candidate"
      - name: Native small response body FIN credit and fault contracts
        run: |
          python benchmarks/run-native-reordering-suite.py --peer "$RUNNER_TEMP/qualification/inputs/peer" \
            --shb "$RUNNER_TEMP/qualification/inputs/candidate" --exposure "$RUNNER_TEMP/observer-build/shb-exposure" \
            --output "$RUNNER_TEMP/qualification/native-small" --namespace sudo --matrix small
      - name: Bounded controls primary and conditional confirmation
        run: |
          sudo "$(command -v python)" benchmarks/heap_guards.py \
            "$RUNNER_TEMP/qualification/inputs/baseline" "$RUNNER_TEMP/qualification/inputs/candidate" \
            "$RUNNER_TEMP/qualification/inputs/peer" "$RUNNER_TEMP/qualification/inputs/hfast" \
            "$RUNNER_TEMP/qualification/campaign"
      - name: Verify frozen inputs after all trials
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'qualification'
          before = json.loads((out / 'build-manifest.json').read_text())['binaries']
          after = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in (out / 'inputs').iterdir()}
          assert before == after
          (out / 'post-binary-hashes.json').write_text(json.dumps(after, indent=2) + '\n')
          PY
      - name: Preserve complete evidence including failed trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receive-heap-qualification
          path: |
            ${{ runner.temp }}/qualification
            ${{ runner.temp }}/peer-build/*.log
            ${{ runner.temp }}/observer-build/build.log
          retention-days: 14
