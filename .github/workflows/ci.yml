name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      # Both profiles, and the debug one first: release turns off the
      # arithmetic overflow checks, so a subtraction that wraps silently there
      # panics here. That is not hypothetical - it hid a chunked-body
      # underflow that made the parser wait for 2^64 more bytes.
      - name: Test (debug, with overflow checks)
        run: cargo test

      - name: Test (release)
        run: cargo test --release

      # Multishot recv and provided buffer rings need kernel 6.0; the setup
      # flags and completion batching degrade gracefully without 6.6 and 6.12.
      # The ubuntu-latest (24.04, kernel 6.8+) VM runners cover all but the
      # batching.
      - name: Smoke test
        run: |
          python3 -m http.server 8000 &
          sleep 1
          ./target/release/shb -n 1000 -c 4 http://127.0.0.1:8000/ | tee smoke.txt
          grep -q "1000 ok" smoke.txt

      # Five of the seventeen servers are built from source, because their
      # projects publish no image to run. Building them on every push takes
      # longer than everything else here put together - OpenSSL 3.5, ngtcp2
      # and nghttp2 in sequence, and H2O - so the layers are cached between
      # runs and only a changed Dockerfile pays for a rebuild.
      - uses: docker/setup-buildx-action@v3

      - name: Build the containers we build ourselves
        uses: docker/bake-action@v6
        with:
          files: docker/compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # Seventeen servers in containers, loaded over every protocol each of
      # them speaks, and eight separate QUIC implementations among them.
      # Unlike scripts/interop.sh these are servers we start ourselves, so
      # this can gate a merge.
      - name: Interop against containerised servers
        run: scripts/docker-interop.sh --down
