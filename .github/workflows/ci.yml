name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # io_uring (multishot recv / provided buffer ring / DEFER_TASKRUN) には
      # kernel 6.6+ が必要。ubuntu-latest (24.04, kernel 6.8+) の VM ランナーで動く
      - name: Smoke test
        run: |
          python3 -m http.server 8000 &
          sleep 1
          ./target/release/shb -n 1000 -c 4 http://127.0.0.1:8000/ | tee smoke.txt
          grep -q "1000 ok" smoke.txt
