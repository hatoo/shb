# TLS on TCP and QUIC on UDP, both on 443, answering the same 13 bytes as
# every other server in this suite
listen:
  port: 443
  ssl:
    certificate-file: /certs/cert.pem
    key-file: /certs/key.pem
listen:
  type: quic
  port: 443
  ssl:
    certificate-file: /certs/cert.pem
    key-file: /certs/key.pem
hosts:
  "*":
    paths:
      /:
        file.dir: /www
access-log: /dev/null
error-log: /dev/stderr
