ServerName localhost
Listen 80
Listen 443
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule http2_module modules/mod_http2.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
ErrorLog /proc/self/fd/2
User daemon
Group daemon
Protocols h2 h2c http/1.1

# Give the server headroom. Every other server here is configured so that the
# benchmark measures shb rather than a default limit - nginx needed its
# keepalive_requests raised for the same reason - and httpd was the one still
# running on stock settings: three children and no HTTP/2 worker tuning at all.
# It failed h2c once in CI at 50 connections and has never reproduced locally,
# so this is headroom rather than a diagnosis.
<IfModule mpm_event_module>
    StartServers            4
    ServerLimit             16
    ThreadLimit             128
    ThreadsPerChild         64
    MaxRequestWorkers       1024
    MaxConnectionsPerChild  0
</IfModule>
# Stock is 100, which would silently close a connection mid-run
MaxKeepAliveRequests 0
H2MinWorkers 32
H2MaxWorkers 128
<VirtualHost *:80>
    RedirectMatch 200 ^/.*$
    Header always set Content-Type "text/plain"
</VirtualHost>
<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /conf/cert.pem
    SSLCertificateKeyFile /conf/key.pem
    RedirectMatch 200 ^/.*$
</VirtualHost>
