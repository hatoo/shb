global
    log stdout format raw local0
defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
# A bind that speaks h2c with prior knowledge cannot also speak HTTP/1.1, so
# the two get a port each
frontend clear_h1
    bind :80
    http-request return status 200 content-type text/plain string "hello, world!"
frontend clear_h2c
    bind :81 proto h2
    http-request return status 200 content-type text/plain string "hello, world!"
# The official haproxy image is built without QUIC, so there is no HTTP/3 here
frontend tls
    bind :443 ssl crt /conf/bundle.pem alpn h2,http/1.1
    http-request return status 200 content-type text/plain string "hello, world!"
