worker_processes 1;
events { worker_connections 1024; }
http {
    access_log off;
    # The /bigheaders response does not fit the defaults
    large_client_header_buffers 4 64k;
    proxy_headers_hash_max_size 4096;
    default_type text/plain;
    server {
        listen 80 default_server;
        http2 on;                         # h1 and h2c on one cleartext socket
        location / { return 200 "hello, world!"; }
        # A response header block too large for one HTTP/2 frame, which forces
        # the server to split it across CONTINUATION frames (RFC 9113 Section
        # 6.10) and gives HTTP/3 a QPACK field section that spans several
        # reads. Both are paths a page-sized response never reaches.
        location /bigheaders {
            add_header X-Big-00 "" always;
            add_header X-Big-01 "" always;
            add_header X-Big-02 "" always;
            add_header X-Big-03 "" always;
            add_header X-Big-04 "" always;
            add_header X-Big-05 "" always;
            add_header X-Big-06 "" always;
            add_header X-Big-07 "" always;
            add_header X-Big-08 "" always;
            add_header X-Big-09 "" always;
            add_header X-Big-10 "" always;
            add_header X-Big-11 "" always;
            add_header X-Big-12 "" always;
            add_header X-Big-13 "" always;
            add_header X-Big-14 "" always;
            add_header X-Big-15 "" always;
            add_header X-Big-16 "" always;
            add_header X-Big-17 "" always;
            add_header X-Big-18 "" always;
            add_header X-Big-19 "" always;
            add_header X-Big-20 "" always;
            add_header X-Big-21 "" always;
            add_header X-Big-22 "" always;
            add_header X-Big-23 "" always;
            return 200 "hello, world!";
        }
    }
    server {
        listen 443 ssl default_server;
        listen 443 quic reuseport;
        http2 on;
        http3 on;
        ssl_certificate     /conf/cert.pem;
        ssl_certificate_key /conf/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / { return 200 "hello, world!"; }
        # A response header block too large for one HTTP/2 frame, which forces
        # the server to split it across CONTINUATION frames (RFC 9113 Section
        # 6.10) and gives HTTP/3 a QPACK field section that spans several
        # reads. Both are paths a page-sized response never reaches.
        location /bigheaders {
            add_header X-Big-00 "" always;
            add_header X-Big-01 "" always;
            add_header X-Big-02 "" always;
            add_header X-Big-03 "" always;
            add_header X-Big-04 "" always;
            add_header X-Big-05 "" always;
            add_header X-Big-06 "" always;
            add_header X-Big-07 "" always;
            add_header X-Big-08 "" always;
            add_header X-Big-09 "" always;
            add_header X-Big-10 "" always;
            add_header X-Big-11 "" always;
            add_header X-Big-12 "" always;
            add_header X-Big-13 "" always;
            add_header X-Big-14 "" always;
            add_header X-Big-15 "" always;
            add_header X-Big-16 "" always;
            add_header X-Big-17 "" always;
            add_header X-Big-18 "" always;
            add_header X-Big-19 "" always;
            add_header X-Big-20 "" always;
            add_header X-Big-21 "" always;
            add_header X-Big-22 "" always;
            add_header X-Big-23 "" always;
            return 200 "hello, world!";
        }
    }
}
