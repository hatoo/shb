worker_processes 1;
events { worker_connections 1024; }
http {
    access_log off;
    # The /bigheaders response does not fit the defaults
    large_client_header_buffers 4 64k;
    proxy_headers_hash_max_size 4096;
    default_type text/plain;
    server {
        listen 80 default_server;
        http2 on;                         # h1 and h2c on one cleartext socket
        location / { return 200 "hello, world!"; }
        # A response body far larger than one receive buffer, one TLS record or
        # one QUIC datagram. Everything else here answers in 13 bytes, so the
        # whole receive path - a response spanning buffers, rustls refusing
        # more ciphertext until the plaintext is drained, QUIC reassembling a
        # stream across datagrams - was only ever walked with a single read.
        # scripts/docker-interop.sh writes the file.
        location = /bigbody { alias /conf/bigbody.txt; }
        # A response header block too large for one HTTP/2 frame, which forces
        # the server to split it across CONTINUATION frames (RFC 9113 Section
        # 6.10) and gives HTTP/3 a QPACK field section that spans several
        # reads. Both are paths a page-sized response never reaches.
        # No keep-alive at all: every response closes the connection
        location /noreuse {
            keepalive_timeout 0;
            return 200 "hello, world!";
        }
        location /bigheaders {
            add_header X-Big-00 "" always;
            add_header X-Big-01 "" always;
            add_header X-Big-02 "" always;
            add_header X-Big-03 "" always;
            add_header X-Big-04 "" always;
            add_header X-Big-05 "" always;
            add_header X-Big-06 "" always;
            add_header X-Big-07 "" always;
            add_header X-Big-08 "" always;
            add_header X-Big-09 "" always;
            add_header X-Big-10 "" always;
            add_header X-Big-11 "" always;
            add_header X-Big-12 "" always;
            add_header X-Big-13 "" always;
            add_header X-Big-14 "" always;
            add_header X-Big-15 "" always;
            add_header X-Big-16 "" always;
            add_header X-Big-17 "" always;
            add_header X-Big-18 "" always;
            add_header X-Big-19 "" always;
            add_header X-Big-20 "" always;
            add_header X-Big-21 "" always;
            add_header X-Big-22 "" always;
            add_header X-Big-23 "" always;
            return 200 "hello, world!";
        }
    }
    server {
        listen 443 ssl default_server;
        listen 443 quic reuseport;
        http2 on;
        http3 on;
        ssl_certificate     /conf/cert.pem;
        ssl_certificate_key /conf/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / { return 200 "hello, world!"; }
        location = /bigbody { alias /conf/bigbody.txt; }
        # A response header block too large for one HTTP/2 frame, which forces
        # the server to split it across CONTINUATION frames (RFC 9113 Section
        # 6.10) and gives HTTP/3 a QPACK field section that spans several
        # reads. Both are paths a page-sized response never reaches.
        # No keep-alive at all: every response closes the connection
        location /noreuse {
            keepalive_timeout 0;
            return 200 "hello, world!";
        }
        location /bigheaders {
            add_header X-Big-00 "" always;
            add_header X-Big-01 "" always;
            add_header X-Big-02 "" always;
            add_header X-Big-03 "" always;
            add_header X-Big-04 "" always;
            add_header X-Big-05 "" always;
            add_header X-Big-06 "" always;
            add_header X-Big-07 "" always;
            add_header X-Big-08 "" always;
            add_header X-Big-09 "" always;
            add_header X-Big-10 "" always;
            add_header X-Big-11 "" always;
            add_header X-Big-12 "" always;
            add_header X-Big-13 "" always;
            add_header X-Big-14 "" always;
            add_header X-Big-15 "" always;
            add_header X-Big-16 "" always;
            add_header X-Big-17 "" always;
            add_header X-Big-18 "" always;
            add_header X-Big-19 "" always;
            add_header X-Big-20 "" always;
            add_header X-Big-21 "" always;
            add_header X-Big-22 "" always;
            add_header X-Big-23 "" always;
            return 200 "hello, world!";
        }
    }
    # A server that takes the connection away mid-run. keepalive_requests has
    # to be set per server rather than per location: on HTTP/2 and HTTP/3 it
    # decides the life of the connection, not of one request, and nginx answers
    # the fifth request with a GOAWAY. On HTTP/1.1 it answers with
    # Connection: close. At 50 requests over 10 connections every connection
    # hits it, so the run only completes if reconnecting works.
    server {
        listen 90;
        listen 453 ssl;
        listen 453 quic;
        http2 on;
        http3 on;
        keepalive_requests 5;
        ssl_certificate     /conf/cert.pem;
        ssl_certificate_key /conf/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / { return 200 "hello, world!"; }
    }
}
